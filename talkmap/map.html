<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talk map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
  <script src="org-locations.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; }
    .leaflet-popup-content { font-size: 13px; line-height: 1.4; max-height: 260px; overflow-y: auto; }
    .talk-list { margin: 6px 0 0; padding-left: 18px; }
    .talk-list li { margin-bottom: 6px; }
    .talk-list span { color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // addressPoints (from org-locations.js): [popupHtml, lat, lng, talkCount, cityName]
    var tiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18,
      attribution: 'Tiles &copy; Esri'
    });
    var map = L.map('map', { center: [30, 10], zoom: 2, layers: [tiles], scrollWheelZoom: false });

    // Cluster badges show the number of talks, not the number of cities.
    var markers = L.markerClusterGroup({
      showCoverageOnHover: false,
      maxClusterRadius: 60,
      iconCreateFunction: function (cluster) {
        var n = cluster.getAllChildMarkers().reduce(function (s, m) { return s + m.options.talks; }, 0);
        var size = n < 10 ? 'small' : n < 30 ? 'medium' : 'large';
        return L.divIcon({ html: '<div><span>' + n + '</span></div>',
                           className: 'marker-cluster marker-cluster-' + size, iconSize: L.point(40, 40) });
      }
    });
    addressPoints.forEach(function (a) {
      var label = a[4] + ' (' + a[3] + (a[3] > 1 ? ' talks)' : ' talk)');
      markers.addLayer(L.marker([a[1], a[2]], { title: label, talks: a[3] }).bindPopup(a[0]));
    });
    map.addLayer(markers);

    // Default view frames the European talks (longitude < 60); markers in Asia
    // stay on the map and appear when zooming out.
    var eu = L.latLngBounds([]);
    addressPoints.forEach(function (a) { if (a[2] < 60) eu.extend([a[1], a[2]]); });
    map.fitBounds((eu.isValid() ? eu : markers.getBounds()).pad(0.15));
  </script>
</body>
</html>
